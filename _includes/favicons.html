<!-- Custom favicon (ICO) with cache-busting -->
{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}
{% assign favicon_v = site.time | date: '%Y%m%d%H%M' %}

<link rel="icon" href="{{ favicon_path }}/favicon.ico?v={{ favicon_v }}" sizes="any">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v={{ favicon_v }}">
<link rel="apple-touch-icon" href="{{ favicon_path }}/favicon.ico?v={{ favicon_v }}">
